name: Release

# Se dispara SOLO con un tag de version (v0.19.0) o a mano.
# Nunca con un push normal: así no se publica código experimental.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribi PUBLICAR para confirmar que queres publicar la version actual del manifest'
        required: true
        type: string

# Permiso global minimo; cada job pide solo lo que necesita.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- 1
  validate:
    name: Validar y empaquetar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      addon_id: ${{ steps.meta.outputs.addon_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Confirmacion manual (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.confirm }}" != "PUBLICAR" ]; then
            echo "::error::Cancelado: hay que escribir PUBLICAR en el campo de confirmacion."
            exit 1
          fi

      - name: Configurar canal de actualizaciones
        env:
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
        run: |
          if [ -z "$UPDATE_BASE_URL" ]; then
            echo "::error::Falta la variable de repositorio UPDATE_BASE_URL (Settings > Secrets and variables > Actions > Variables). Ejemplo: https://usuario.github.io/floorp-system"
            exit 1
          fi
          python tools/configure.py --base-url "$UPDATE_BASE_URL"

      - name: Validar proyecto
        run: python tools/validate.py --release

      - name: Leer version e id
        id: meta
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          m = json.load(open('floorp-system-extension/manifest.json'))
          print("version=" + m["version"])
          print("addon_id=" + m["browser_specific_settings"]["gecko"]["id"])
          EOF

      - name: La version del tag debe coincidir con el manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          EXPECTED="v${{ steps.meta.outputs.version }}"
          if [ "$EXPECTED" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::El tag es ${GITHUB_REF_NAME} pero el manifest declara ${{ steps.meta.outputs.version }}. Corregi la version antes de publicar."
            exit 1
          fi
          echo "tag y manifest coinciden: $EXPECTED"

      - name: Empaquetar XPI
        run: python tools/build_xpi.py

      - name: Guardar XPI sin firmar + informe
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: |
            dist/floorp-system-unsigned.xpi
            dist/build-info.json
          retention-days: 7

  # ---------------------------------------------------------------- 2
  sign:
    name: Firmar en Mozilla (AMO)
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: unsigned
          path: dist

      - name: Comprobar credenciales
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          if [ -z "$AMO_API_KEY" ] || [ -z "$AMO_API_SECRET" ]; then
            echo "::error::Faltan los secretos AMO_API_KEY / AMO_API_SECRET. Se obtienen en https://addons.mozilla.org/developers/addon/api/key/ y se cargan en Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi

      - name: Firmar
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: python tools/sign_amo.py --xpi dist/floorp-system-unsigned.xpi

      - name: Guardar XPI firmado
        uses: actions/upload-artifact@v4
        with:
          name: signed
          path: |
            dist/floorp-system-signed.xpi
            dist/sign-info.json
          retention-days: 7

  # ---------------------------------------------------------------- 3
  publish:
    name: Publicar release
    needs: [validate, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      download_url: ${{ steps.asset.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: signed
          path: dist

      - name: Verificar el XPI firmado antes de publicarlo
        run: |
          python - <<'EOF'
          import hashlib, json, zipfile, sys
          from pathlib import Path
          p = Path("dist/floorp-system-signed.xpi")
          if not p.exists():
              sys.exit("no existe el XPI firmado")
          with zipfile.ZipFile(p) as zf:
              names = zf.namelist()
              if "META-INF/mozilla.rsa" not in names:
                  sys.exit("el XPI no tiene firma de Mozilla (META-INF/mozilla.rsa)")
              m = json.loads(zf.read("manifest.json"))
          gecko = m["browser_specific_settings"]["gecko"]
          if "update_url" not in gecko:
              sys.exit("el XPI firmado no incluye update_url: las actualizaciones no funcionarian")
          print("version:", m["version"], "| id:", gecko["id"])
          print("sha256:", hashlib.sha256(p.read_bytes()).hexdigest())
          Path("dist/floorp-system.xpi").write_bytes(p.read_bytes())
          Path("dist/SHA256SUMS.txt").write_text(
              f"{hashlib.sha256(p.read_bytes()).hexdigest()}  floorp-system-{m['version']}.xpi\n")
          Path("dist/VERSION").write_text(m["version"])
          EOF

      - name: Crear el release con el XPI adjunto
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/floorp-system.xpi
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirmar que el archivo publicado es descargable
        id: asset
        run: |
          VERSION=$(cat dist/VERSION)
          URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/floorp-system.xpi"
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -L -I "$URL" || true)
            if [ "$CODE" = "200" ]; then
              echo "descarga verificada: $URL"
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "todavia no responde ($CODE), reintento $i/20..."
            sleep 10
          done
          echo "::error::El archivo del release no responde; NO se publica el manifiesto de actualizaciones."
          exit 1

  # ---------------------------------------------------------------- 4
  pages:
    name: Publicar canal de actualizaciones
    needs: [publish, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configurar canal
        env:
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
        run: python tools/configure.py --base-url "$UPDATE_BASE_URL"

      - uses: actions/download-artifact@v4
        with:
          name: signed
          path: dist

      - name: Generar updates.json apuntando al archivo ya publicado
        run: |
          python tools/publish_update.py \
            --xpi dist/floorp-system-signed.xpi \
            --download-url "${{ needs.publish.outputs.download_url }}"

      - name: Verificar el manifiesto generado
        run: python tools/validate.py --release

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
