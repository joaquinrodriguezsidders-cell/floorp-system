name: Release

# Dos formas de dispararlo, con consecuencias MUY distintas:
#
#   * push de un tag v*.*.*   -> publicación real (firma + release + canal)
#   * ejecución manual        -> SIMULACIÓN: valida y empaqueta, no firma,
#                                no crea releases y no toca el canal.
#
# Nunca se dispara con un push normal: así no se publica código experimental.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Permiso global mínimo; cada job pide solo lo que necesita.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- 1
  validate:
    name: Validar y empaquetar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      addon_id: ${{ steps.meta.outputs.addon_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configurar canal de actualizaciones
        env:
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
        run: |
          # La variable es opcional: release.config.json ya lleva la base del canal.
          # Si existe la variable, gana ella (permite mover el canal sin tocar código).
          if [ -z "$UPDATE_BASE_URL" ]; then
            UPDATE_BASE_URL=$(python -c "import json;print(json.load(open('release.config.json'))['pages_base_url'])" 2>/dev/null || true)
            echo "sin variable UPDATE_BASE_URL: uso release.config.json -> $UPDATE_BASE_URL"
          fi
          if [ -z "$UPDATE_BASE_URL" ]; then
            echo "::error::Falta la variable de repositorio UPDATE_BASE_URL."
            echo "::error::Se carga en Settings > Secrets and variables > Actions > pestaña Variables."
            echo "::error::Valor de ejemplo: https://TU-USUARIO.github.io/floorp-system"
            exit 1
          fi
          python tools/configure.py --base-url "$UPDATE_BASE_URL"

      - name: Validar el proyecto
        run: python tools/validate.py --release

      - name: Leer versión e identificador
        id: meta
        run: python tools/verify_release.py --check-meta-only --github-output "$GITHUB_OUTPUT"

      - name: El tag debe coincidir con la versión del manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          EXPECTED="v${{ steps.meta.outputs.version }}"
          if [ "$EXPECTED" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::El tag es ${GITHUB_REF_NAME} pero el manifest declara v${{ steps.meta.outputs.version }}."
            echo "::error::Corregí la versión del proyecto o creá el tag con el nombre correcto."
            exit 1
          fi
          echo "tag y manifest coinciden: $EXPECTED"

      - name: Empaquetar XPI
        run: python tools/build_xpi.py

      - name: Comprobar el paquete recién construido
        run: |
          python tools/verify_release.py \
            --xpi dist/floorp-system-unsigned.xpi --allow-unsigned

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: |
            dist/floorp-system-unsigned.xpi
            dist/build-info.json
          retention-days: 7

      - name: Resumen
        if: always()
        run: |
          {
            echo "## FLOORP SYSTEM — validación"
            echo ""
            echo "- versión: \`${{ steps.meta.outputs.version }}\`"
            echo "- id: \`${{ steps.meta.outputs.addon_id }}\`"
            echo "- canal: \`${{ vars.UPDATE_BASE_URL }}\`"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo ""
              echo "> Ejecución manual: **simulación**. No se firmó ni publicó nada."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- 2
  sign:
    name: Firmar en Mozilla (AMO)
    needs: validate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: unsigned
          path: dist

      - name: Comprobar que existen las credenciales
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          MISSING=0
          if [ -z "$AMO_API_KEY" ]; then
            echo "::error::Falta el secreto AMO_API_KEY."
            MISSING=1
          fi
          if [ -z "$AMO_API_SECRET" ]; then
            echo "::error::Falta el secreto AMO_API_SECRET."
            MISSING=1
          fi
          if [ "$MISSING" = "1" ]; then
            echo "::error::Se obtienen en https://addons.mozilla.org/developers/addon/api/key/"
            echo "::error::y se cargan en Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi

      - name: Firmar
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: python tools/sign_amo.py --xpi dist/floorp-system-unsigned.xpi

      - name: Verificar la firma y el canal del paquete
        env:
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
        run: |
          # Sin variable, verify_release usa la base de release.config.json
          BASE_ARG=""
          if [ -n "$UPDATE_BASE_URL" ]; then BASE_ARG="--base-url $UPDATE_BASE_URL"; fi
          python tools/verify_release.py \
            --xpi dist/floorp-system-signed.xpi \
            --expect-version "${{ needs.validate.outputs.version }}" $BASE_ARG

      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            dist/floorp-system-*.xpi
            dist/sign-info.json
            dist/SHA256SUMS.txt
            dist/VERSION
          retention-days: 7

  # ---------------------------------------------------------------- 3
  publish:
    name: Publicar el release
    needs: [validate, sign]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      download_url: ${{ steps.asset.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist

      - name: Crear el release con el XPI adjunto
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/floorp-system-${{ needs.validate.outputs.version }}.xpi
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Confirmar que el archivo publicado es realmente descargable
        id: asset
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/floorp-system-${{ needs.validate.outputs.version }}.xpi"
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -L -I "$URL" || true)
            if [ "$CODE" = "200" ]; then
              echo "descarga verificada: $URL"
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "el archivo todavía no responde ($CODE). Reintento $i/20..."
            sleep 10
          done
          echo "::error::El archivo del release no responde. NO se publica el canal de actualizaciones."
          exit 1

      - name: Resumen
        run: |
          {
            echo "## FLOORP SYSTEM v${{ needs.validate.outputs.version }} publicado"
            echo ""
            echo "- descarga: ${{ steps.asset.outputs.url }}"
            echo "- sha256:"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- 4
  pages:
    name: Publicar el canal de actualizaciones
    needs: [validate, publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configurar canal
        env:
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
        run: |
          if [ -z "$UPDATE_BASE_URL" ]; then
            UPDATE_BASE_URL=$(python -c "import json;print(json.load(open('release.config.json'))['pages_base_url'])")
            echo "sin variable: uso release.config.json -> $UPDATE_BASE_URL"
          fi
          python tools/configure.py --base-url "$UPDATE_BASE_URL"

      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist

      - name: Generar el manifiesto apuntando al archivo YA publicado
        run: |
          python tools/publish_update.py \
            --xpi "dist/floorp-system-${{ needs.validate.outputs.version }}.xpi" \
            --download-url "${{ needs.publish.outputs.download_url }}"

      - name: Verificar el manifiesto antes de subirlo
        run: python tools/validate.py --release

      - uses: actions/configure-pages@v5
        with:
          # Habilita Pages solo si todavía no está activado: así el canal
          # funciona sin tener que tocar Settings a mano.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Resumen
        run: |
          {
            echo "## Canal de actualizaciones publicado"
            echo ""
            echo "- endpoint: ${{ vars.UPDATE_BASE_URL }}/updates.json"
            echo "- versión anunciada: \`${{ needs.validate.outputs.version }}\`"
            echo ""
            echo "Las instalaciones que ya tengan el canal recibirán esta versión solas."
          } >> "$GITHUB_STEP_SUMMARY"
